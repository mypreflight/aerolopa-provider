name: 'release'

on:
  push:
    branches: ['main']

jobs:
  tag:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@v7
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    runs-on: 'ubuntu-latest'
    environment: image
    steps:
      - name: 'Login to ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: 'ghcr.io'
          username: '${{github.actor}}'
          password: '${{secrets.GITHUB_TOKEN}}'
      - name: 'Clone repository'
        uses: actions/checkout@v7
      - name: 'Build app docker image'
        run: |
          AUTHOR=$(jq -r ".author" package.json)
          NAME=$(jq -r ".name" package.json)
          VERSION=$(jq -r ".version" package.json)

          IMAGE="ghcr.io/${AUTHOR}/${NAME}"
          docker build --target production -t "${IMAGE}:${VERSION}" .

          # tag same image as :latest
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
      - name: 'Push docker image to ghcr.io'
        run: |
          AUTHOR=$(jq -r ".author" package.json)
          NAME=$(jq -r ".name" package.json)
          VERSION=$(jq -r ".version" package.json)

          IMAGE="ghcr.io/${AUTHOR}/${NAME}"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
  release:
    needs: deploy
    runs-on: ubuntu-latest
    environment: 'production'
    steps:
      - name: 'Install doctl'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: 'Roll the new image out on the shared app'
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header \
            | awk '$2 == "mypreflight" { print $1 }')

          if [ -z "$APP_ID" ]; then
            echo "App mypreflight not found" >&2
            exit 1
          fi

          doctl apps create-deployment "$APP_ID" --wait
