name: 'integrity'

on:
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: gi-org-pl/check-crlf-action@v1
      - name: 'Check for file permission changes'
        uses: gi-org-pl/check-file-permissions-action@v1
      - name: 'Check app version is unique'
        uses: gi-org-pl/check-version-action@v1
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
      - name: 'Copy environment variables'
        run: 'cp .env.dist .env'
      - name: 'Run docker compose environment'
        run: docker compose up -d --build --wait
      - name: 'Run static code analysis'
        run: docker compose exec app npm run lint
      - name: 'Run type check'
        run: docker compose exec app npm run typecheck
      - name: 'Run unit tests'
        run: docker compose exec app npm test
      - name: 'Run functional tests'
        run: docker compose exec app npm run test:functional
      - name: 'Build the function the way DigitalOcean does'
        run: |
          docker compose exec app sh -c '
            rm -rf /tmp/slice && mkdir -p /tmp/slice
            cp -r packages/aerolopa/seatmap /tmp/slice/seatmap
            rm -rf /tmp/slice/seatmap/lib /tmp/slice/seatmap/node_modules
            /tmp/slice/seatmap/build.sh
            test -f /tmp/slice/seatmap/lib/function.js
          '
